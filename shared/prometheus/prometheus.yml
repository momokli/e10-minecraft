global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "flask-metrics"
    scrape_interval: 5s
    static_configs:
      - targets: ["flask:5000"]
    metrics_path: /metrics

  - job_name: "minecraft"
    static_configs:
      - targets: ["mc-prod:1950"]
        labels:
          instance: "prod"
    metrics_path: /metrics
