<!doctype html>
<html lang="de">
    <head>
        <title>Spenden · Enigmatica 10</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <style>
            :root {
                --bg: #0d1117;
                --card: #161b22;
                --border: #30363d;
                --accent: #58a6ff;
                --text: #c9d1d9;
                --dim: #8b949e;
                --green: #3fb950;
            }
            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
                background: var(--bg);
                color: var(--text);
                min-height: 100vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 1.5rem 1rem;
            }
            .container {
                max-width: 520px;
                width: 100%;
            }
            h1 {
                font-size: 1.4rem;
                margin-bottom: 0.2rem;
            }
            .sub {
                color: var(--dim);
                font-size: 0.82rem;
                margin-bottom: 1.5rem;
            }
            .card {
                background: var(--card);
                border: 1px solid var(--border);
                border-radius: 8px;
                padding: 1.2rem;
                margin-bottom: 1rem;
            }
            .cost-row {
                display: flex;
                justify-content: space-between;
                padding: 0.35rem 0;
                font-size: 0.88rem;
            }
            .cost-row .label {
                color: var(--dim);
            }
            .cost-row.total {
                border-top: 1px solid var(--border);
                margin-top: 0.25rem;
                padding-top: 0.5rem;
                font-weight: 600;
            }
            .progress-section {
                margin: 1rem 0;
            }
            .progress-label {
                display: flex;
                justify-content: space-between;
                font-size: 0.8rem;
                color: var(--dim);
                margin-bottom: 0.3rem;
            }
            .progress-bar {
                height: 10px;
                background: var(--border);
                border-radius: 5px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                background: var(--green);
                border-radius: 5px;
                transition: width 0.5s ease;
            }
            .donate-btn {
                display: block;
                width: 100%;
                text-align: center;
                padding: 0.7rem;
                background: var(--accent);
                color: #000;
                border: none;
                border-radius: 6px;
                font-size: 0.95rem;
                font-weight: 600;
                cursor: pointer;
                text-decoration: none;
                margin-top: 0.5rem;
            }
            .donate-btn:hover {
                opacity: 0.9;
            }
            .note {
                font-size: 0.72rem;
                color: var(--dim);
                line-height: 1.5;
                margin-top: 1rem;
            }
            .note a {
                color: var(--accent);
                text-decoration: none;
            }
            .note a:hover {
                text-decoration: underline;
            }
            .back {
                color: var(--dim);
                font-size: 0.78rem;
                text-decoration: none;
                margin-top: 1rem;
                display: inline-block;
            }
            .back:hover {
                color: var(--text);
            }
        </style>
    </head>
    <body>
        <div class="container">
            <h1>Enigmatica 10</h1>
            <p class="sub">Serverkosten</p>

            <div class="card">
                <div class="cost-row">
                    <span class="label">Server-Hosting (VPS-Anteil)</span
                    ><span>15,00&nbsp;€</span>
                </div>
                <div class="cost-row total">
                    <span class="label">Monatliche Kosten</span><span>15,00&nbsp;€</span>
                </div>
            </div>

            <div class="card">
                <div id="progress-section">
                    <div class="progress-label">
                        <span>Diesen Monat</span>
                        <span
                            ><strong id="donated">0&nbsp;€</strong> /
                            <span id="goal">15&nbsp;€</span></span
                        >
                    </div>
                    <div class="progress-bar">
                        <div
                            class="progress-fill"
                            id="progress-fill"
                            style="width: 0%"
                        ></div>
                    </div>
                </div>

                <a
                    class="donate-btn"
                    href="https://ko-fi.com/momokli"
                    target="_blank"
                    rel="noopener"
                >
                    💛 Via Ko-fi spenden
                </a>
            </div>

            <a class="back" href="/">← Zurück zum Dashboard</a>
        </div>

        <script>
            async function update() {
                try {
                    var r = await fetch("/api/donations");
                    var d = await r.json();
                    document.getElementById("donated").textContent =
                        d.total_eur.toFixed(2).replace(".", ",") + " €";
                    document.getElementById("goal").textContent =
                        d.goal_eur.toFixed(2).replace(".", ",") + " €";
                    document.getElementById("progress-fill").style.width =
                        d.progress_pct + "%";
                } catch (e) {}
            }
            update();
            setInterval(update, 30000);
        </script>
    </body>
</html>
